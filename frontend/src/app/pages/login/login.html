<div class="min-h-screen bg-[#F5F1EB] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-sm">

    <!-- Logo -->
    <div class="text-center mb-8">
      <img
        src="/assets/logoEntreLinhas.svg"
        alt="Entre Linhas"
        class="h-28 w-auto mx-auto mb-2 object-contain"
      />
      <p class="text-xs text-[#B6B6B7] uppercase tracking-widest font-medium mt-4">Área Administrativa</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-sm p-8 space-y-5">

      <form [formGroup]="authForm" (ngSubmit)="loginUser()" class="space-y-4">

        <div>
          <label class="block text-xs font-semibold text-[#626262] uppercase tracking-wide mb-1.5">Usuário</label>
          <input
            type="text"
            formControlName="login"
            autocomplete="username"
            placeholder="Digite seu usuário"
            class="w-full border border-[#EDE8E0] rounded-lg px-3.5 py-3 text-sm text-[#2C2C2C] placeholder-[#B6B6B7] focus:outline-none focus:ring-2 focus:ring-[#CF4E4E] focus:border-transparent transition-shadow"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-[#626262] uppercase tracking-wide mb-1.5">Senha</label>
          <input
            type="password"
            formControlName="password"
            autocomplete="current-password"
            placeholder="••••••••"
            class="w-full border border-[#EDE8E0] rounded-lg px-3.5 py-3 text-sm text-[#2C2C2C] placeholder-[#B6B6B7] focus:outline-none focus:ring-2 focus:ring-[#CF4E4E] focus:border-transparent transition-shadow"
          />
        </div>

        <div *ngIf="errorMessage" class="flex items-center gap-2 bg-red-50 border border-red-100 rounded-lg px-3.5 py-3 text-sm text-red-600">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M12 3a9 9 0 100 18A9 9 0 0012 3z"/>
          </svg>
          {{ errorMessage }}
        </div>

        <button
          type="submit"
          [disabled]="authForm.invalid || isSubmitting"
          class="w-full py-3 rounded-lg bg-[#CF4E4E] hover:bg-[#B03A3A] disabled:opacity-60 disabled:cursor-not-allowed text-white text-sm font-semibold transition-colors duration-200 shadow-md hover:shadow-lg flex items-center justify-center gap-2"
        >
          <svg *ngIf="isSubmitting" class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v3m0 12v3m9-9h-3M6 12H3m15.364-6.364l-2.121 2.121M8.757 15.243l-2.121 2.121M18.364 18.364l-2.121-2.121M8.757 8.757L6.636 6.636"/>
          </svg>
          {{ isSubmitting ? 'Entrando...' : 'Entrar' }}
        </button>
      </form>
    </div>

    <!-- Links -->
    <div class="flex flex-col items-center gap-2 mt-6">
      <a routerLink="/" class="text-xs text-[#B6B6B7] hover:text-[#CF4E4E] transition-colors">
        ← Voltar para o site
      </a>
    </div>

  </div>
</div>
